<a
  href="#main"
  class="sr-only z-[60] rounded-md bg-card px-4 py-2 text-foreground focus:not-sr-only focus:fixed focus:top-2 focus:left-2"
>
  {{ s.skipToContent }}
</a>

<header class="sticky top-0 z-50 border-b border-border bg-secondary text-secondary-foreground">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-2 px-4 py-3 md:py-4">
    <a
      [routerLink]="homePath"
      class="flex min-w-0 items-center gap-2 transition-opacity hover:opacity-80"
    >
      <svg [appIcon]="icons.FileText" class="size-6 md:size-8"></svg>
      <span class="min-w-0">
        <span class="block truncate text-base font-bold md:text-xl">{{ s.title }}</span>
        <span class="hidden text-xs opacity-90 sm:block">{{ s.subtitle }}</span>
      </span>
    </a>

    <nav class="hidden gap-6 lg:flex" [attr.aria-label]="s.mainNav">
      <a
        [routerLink]="homePath"
        fragment="forms"
        class="whitespace-nowrap underline-offset-4 hover:underline"
      >
        {{ s.forms }}
      </a>
      <a [routerLink]="calculatorPath" class="whitespace-nowrap underline-offset-4 hover:underline">
        {{ s.calculator }}
      </a>
      <a [routerLink]="helpPath" class="whitespace-nowrap underline-offset-4 hover:underline">
        {{ s.help }}
      </a>
    </nav>

    <div class="flex items-center gap-1 md:gap-2">
      <a
        [href]="donateUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-primary btn-sm hidden md:inline-flex"
        [attr.aria-label]="s.support"
      >
        <svg [appIcon]="icons.Heart" class="size-4"></svg>
        <span class="hidden lg:inline">{{ s.support }}</span>
      </a>
      <app-theme-toggle />
      <button
        type="button"
        class="btn btn-ghost btn-icon lg:hidden"
        aria-haspopup="dialog"
        [attr.aria-label]="s.openMenu"
        (click)="openMenu()"
      >
        <svg [appIcon]="icons.Menu" class="size-5"></svg>
      </button>
    </div>
  </div>
</header>

<dialog
  #menu
  class="fixed inset-y-0 right-0 left-auto m-0 h-dvh max-h-dvh w-[320px] max-w-full border-l border-border bg-card p-0 text-card-foreground shadow-lg backdrop:bg-black/50 sm:w-[400px]"
  aria-labelledby="mobile-menu-title"
  (click)="onDialogClick($event)"
>
  <div class="flex h-full flex-col">
    <div class="flex items-center gap-3 border-b border-border px-6 py-4">
      <div class="flex size-10 items-center justify-center rounded-xl bg-primary/10">
        <svg [appIcon]="icons.FileText" class="size-5 text-primary"></svg>
      </div>
      <div class="min-w-0 flex-1">
        <p id="mobile-menu-title" class="text-lg font-semibold">{{ s.title }}</p>
        <p class="text-xs text-muted-foreground">{{ s.subtitle }}</p>
      </div>
      <button
        type="button"
        class="btn btn-ghost btn-icon"
        [attr.aria-label]="s.closeMenu"
        (click)="closeMenu()"
      >
        <svg [appIcon]="icons.X" class="size-5"></svg>
      </button>
    </div>

    <nav class="flex flex-col gap-2 px-6 py-6" [attr.aria-label]="s.mainNav">
      <a
        [routerLink]="homePath"
        fragment="forms"
        class="group flex items-center gap-4 rounded-lg px-4 py-3.5 text-base font-medium transition-colors hover:bg-muted"
        (click)="closeMenu()"
      >
        <span class="flex size-9 items-center justify-center rounded-lg bg-primary/10">
          <svg [appIcon]="icons.FileText" class="size-4 text-primary"></svg>
        </span>
        <span class="flex-1">{{ s.forms }}</span>
      </a>
      <a
        [routerLink]="calculatorPath"
        class="group flex items-center gap-4 rounded-lg px-4 py-3.5 text-base font-medium transition-colors hover:bg-muted"
        (click)="closeMenu()"
      >
        <span class="flex size-9 items-center justify-center rounded-lg bg-accent/10">
          <svg [appIcon]="icons.Calculator" class="size-4 text-accent"></svg>
        </span>
        <span class="flex-1">{{ s.calculator }}</span>
      </a>
      <a
        [routerLink]="helpPath"
        class="group flex items-center gap-4 rounded-lg px-4 py-3.5 text-base font-medium transition-colors hover:bg-muted"
        (click)="closeMenu()"
      >
        <span class="flex size-9 items-center justify-center rounded-lg bg-accent/10">
          <svg [appIcon]="icons.HelpCircle" class="size-4 text-accent"></svg>
        </span>
        <span class="flex-1">{{ s.help }}</span>
      </a>
    </nav>

    <div class="mt-auto border-t border-border px-6 py-6">
      <a
        [href]="donateUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-primary btn-lg w-full gap-3 shadow-lg"
      >
        <svg [appIcon]="icons.Heart" class="size-5 fill-current"></svg>
        <span class="font-semibold">{{ s.support }}</span>
      </a>
    </div>
  </div>
</dialog>
